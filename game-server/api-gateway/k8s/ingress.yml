apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosmic-void-ingress
  labels:
    app: cosmic-void
    component: api-gateway
  annotations:
    # GCP-native HTTP(S) Load Balancer.
    kubernetes.io/ingress.class: "gce"
    # Bind to the global static IP reserved as `cosmic-void-ingress`.
    kubernetes.io/ingress.global-static-ip-name: "cosmic-void-ingress"
    # TLS is handled by Cloudflare in front of this LB (orange-cloud proxy,
    # SSL mode = Flexible). LB serves plain HTTP on port 80; no ManagedCert
    # / FrontendConfig needed here.
spec:
  rules:
  # Backend API
  - host: api.cosmicvoid.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http

  # Root domain + www
  #   - /game/ws  → game-service:5555 (WebSocket upgrade)
  #   - /        → game-client (Next.js frontend)
  # GCE LB URL Map does longest-prefix-match, so /game/ws wins over / regardless
  # of order, but listing the specific path first keeps intent clear.
  - host: cosmicvoid.uk
    http:
      paths:
      - path: /game/ws
        pathType: Prefix
        backend:
          service:
            name: game-service-ws
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: game-client
            port:
              name: http
  - host: www.cosmicvoid.uk
    http:
      paths:
      - path: /game/ws
        pathType: Prefix
        backend:
          service:
            name: game-service-ws
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: game-client
            port:
              name: http
