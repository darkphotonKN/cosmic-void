kind: ConfigMap
apiVersion: v1
metadata:
  name: stats-service-config
  labels:
    app: cosmic-void
    component: stats-service
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "PRODUCTION"
  GRPC_STATS_ADDR: "7011"

  DB_HOST: "auth-service-db"
  DB_PORT: "5432"
  DB_NAME: "cosmic_void_stats_service_db"
  DB_USER: "user"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "cosmicvoid"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  K8S_NAMESPACE: "cosmic-void"
  COLLECTOR_ENDPOINT: "otel-collector:4317"
