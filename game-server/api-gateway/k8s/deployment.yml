apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: cosmic-void
    component: api-gateway
spec:
  selector:
    matchLabels:
      app: cosmic-void
      component: api-gateway
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: cosmic-void
        component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: us-central1-docker.pkg.dev/project-b6e8596f-fe1e-4dca-a7a/cosmic-void/api-gateway:v2
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 7001
          initialDelaySeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        # GCE Ingress (with no BackendConfig) uses readinessProbe as the
        # LB health check. Must hit a path that responds 200, otherwise the
        # LB marks all api-gateway pods UNHEALTHY and returns 502 to clients.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7001
          initialDelaySeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: TZ
          value: "Asia/Taipei"
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        ports:
        - containerPort: 7001
          name: http
      restartPolicy: Always
