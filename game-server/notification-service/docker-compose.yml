version: "3.9"

services:
  db:
    image: postgres:17
    container_name: cosmic_void_notification_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_notification_service_db
    ports:
      - "5177:5432"
    volumes:
      - cosmic_void_notification_service_pgdata:/var/lib/postgresql/data

  test-db:
    image: postgres:17
    container_name: cosmic_void_notification_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_notification_service_test_db
    ports:
      - "5178:5432"
    volumes:
      - cosmic_void_notification_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: cosmic-void-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmic-void-network

volumes:
  cosmic_void_notification_service_pgdata:
  cosmic_void_notification_service_test_pgdata:
  redis_data:
