syntax = "proto3";
package notification;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
option go_package = "github.com/darkphotonKN/cosmic-void-server/common/api/proto/notification";

// NotificationService external API for notification

service NotificationService {
  rpc GetNotification(NotificationRequest) returns (NotificationResponse);
}

message NotificationRequest {
  string user_id = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message NotificationList {
  string user_id = 1;
  string title = 2;
  string message = 3;
  google.protobuf.Struct data = 4;
}

message NotificationResponse {
    repeated NotificationList notifications = 1;
    int32 total = 2;
}
