apiVersion: v1
kind: Service
metadata:
  name: game-client
  labels:
    app: cosmic-void
    component: game-client
  annotations:
    # Container-native LB via NEG — GCE Ingress hits Pod IPs directly.
    cloud.google.com/neg: '{"ingress": true}'
    # Custom health check on / (Next.js homepage returns 200).
    cloud.google.com/backend-config: '{"default": "game-client-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: cosmic-void
    component: game-client
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
