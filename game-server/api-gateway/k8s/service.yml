apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: cosmic-void
    component: api-gateway
  annotations:
    # Container-native LB: GCE Ingress bypasses kube-proxy and hits Pod IPs
    # directly via Network Endpoint Groups. Required for GKE Ingress to use
    # this Service as a backend.
    cloud.google.com/neg: '{"ingress": true}'
    # Tells the GCE Ingress controller to apply BackendConfig
    # `api-gateway-backend-config` (custom health check on /healthz) to
    # the BackendService created for this Service.
    cloud.google.com/backend-config: '{"default": "api-gateway-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: cosmic-void
    component: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
