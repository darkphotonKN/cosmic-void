# =============================================================================
# Consul (in-cluster, dev/learning purposes — 單節點 dev mode)
#
# 對齊 docker-compose 的設定：
#   command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
#
# Service name = "consul" 對齊 ConfigMap CONSUL_ADDR=consul:8500
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: default
  labels:
    app: cosmic-void
    component: consul
spec:
  type: ClusterIP
  selector:
    app: cosmic-void
    component: consul
  ports:
  - name: http
    port: 8500
    targetPort: 8500
    protocol: TCP
  - name: dns-tcp
    port: 8600
    targetPort: 8600
    protocol: TCP
  - name: dns-udp
    port: 8600
    targetPort: 8600
    protocol: UDP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul
  namespace: default
  labels:
    app: cosmic-void
    component: consul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosmic-void
      component: consul
  template:
    metadata:
      labels:
        app: cosmic-void
        component: consul
    spec:
      containers:
      - name: consul
        image: hashicorp/consul:latest
        imagePullPolicy: IfNotPresent
        args:
        - "agent"
        - "-server"
        - "-ui"
        - "-node=server-1"
        - "-bootstrap-expect=1"
        - "-client=0.0.0.0"
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8600
          name: dns-tcp
          protocol: TCP
        - containerPort: 8600
          name: dns-udp
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: consul-data
          mountPath: /consul/data
      volumes:
      - name: consul-data
        emptyDir: {}
