  # API Gateway volumes
  cosmic_void_api_gateway_pgdata:
  cosmic_void_api_gateway_test_pgdata:
  # Example Service volumes
  cosmic_void_example_service_pgdata:
  cosmic_void_example_service_test_pgdata:
