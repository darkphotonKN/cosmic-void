kind: ConfigMap
apiVersion: v1
metadata:
  name: items-service-config
  labels:
    app: cosmic-void
    component: items-service
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "PRODUCTION"
  GRPC_ITEMS_ADDR: "7013"

  DB_HOST: "auth-service-db"
  DB_PORT: "5432"
  DB_NAME: "cosmic_void_items_service_db"
  DB_USER: "user"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "cosmicvoid"

  REDIS_MODE: "standalone"
  REDIS_ADDR: "redis:6379"

  K8S_NAMESPACE: "cosmic-void"
  COLLECTOR_ENDPOINT: "otel-collector:4317"
