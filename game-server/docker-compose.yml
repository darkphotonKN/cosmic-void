version: "3.9"
services:
  cosmic-void-consul:
    image: hashicorp/consul
    container_name: cosmic-void-consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - 8510:8500 # Changed from 8500 to avoid conflicts
      - 8610:8600/udp # Changed from 8600 to avoid conflicts
    volumes:
      - cosmic-void-consul-data:/consul/data
    networks:
      - cosmic-void-network

  cosmic-void-rabbitmq:
    image: "rabbitmq:3-management"
    container_name: cosmic-void-rabbitmq
    ports:
      - "15682:15672" # Changed from 15672 to avoid conflicts
      - "5682:5672" # Changed from 5672 to avoid conflicts
    environment:
      - RABBITMQ_DEFAULT_USER=cosmicvoid
      - RABBITMQ_DEFAULT_PASS=cosmicvoid
    volumes:
      - cosmic-void-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cosmic-void-network

  redis:
    image: redis:7-alpine
    container_name: cosmic-void-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cosmic-void-network

  # Auth Service Database
  auth-service-db:
    image: postgres:17
    container_name: cosmic_void_auth_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_auth_service_db
    ports:
      - "5103:5432"
    volumes:
      - cosmic_void_auth_service_pgdata:/var/lib/postgresql/data
    networks:
      - cosmic-void-network

  auth-service-test-db:
    image: postgres:17
    container_name: cosmic_void_auth_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_auth_service_test_db
    ports:
      - "6103:5432"
    volumes:
      - cosmic_void_auth_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - cosmic-void-network

  # Game Service Database
  game-service-db:
    image: postgres:17
    container_name: cosmic_void_game_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_game_service_db
    ports:
      - "5030:5432"
    volumes:
      - cosmic_void_game_service_pgdata:/var/lib/postgresql/data
    networks:
      - cosmic-void-network

  game-service-test-db:
    image: postgres:17
    container_name: cosmic_void_game_service_test_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_game_service_test_db
    ports:
      - "6004:5432"
    volumes:
      - cosmic_void_game_service_test_pgdata:/var/lib/postgresql/data
    restart: "no"
    networks:
      - cosmic-void-network

  # Stats Service Database
  stats-service-db:
