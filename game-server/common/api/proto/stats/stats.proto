syntax = "proto3";

package stats;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/darkphotonKN/cosmic-void-server/common/api/proto/stats";

// StatsService provides methods for creating player statistics records
service StatsService {
  // Create a new player match stats record
  rpc CreatePlayerMatchStats(CreatePlayerMatchStatsRequest) returns (PlayerMatchStats);

  // Create a new player ranking stats record
  rpc CreatePlayerRankingStats(CreatePlayerRankingStatsRequest) returns (PlayerRankingStats);

  // Create a new match history record
  rpc CreateMatchHistory(CreateMatchHistoryRequest) returns (MatchHistory);
}

// PlayerMatchStats represents aggregated match statistics for a player
message PlayerMatchStats {
  string id = 1;
  string member_id = 2;
  int32 games_played = 3;
  int32 wins = 4;
  int32 losses = 5;
  int32 kills = 6;
  int32 deaths = 7;
  int32 times_placed_top_three = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Request to create player match stats
message CreatePlayerMatchStatsRequest {
  string member_id = 1;
  int32 games_played = 2;
  int32 wins = 3;
  int32 losses = 4;
  int32 kills = 5;
  int32 deaths = 6;
  int32 times_placed_top_three = 7;
}

// PlayerRankingStats represents ranking and leaderboard data
message PlayerRankingStats {
  string id = 1;
  string member_id = 2;
  string username = 3;
  int32 wins = 4;
  int32 top_threes = 5;
  int32 rating = 6;
  optional int32 rank_position = 7;
  google.protobuf.Timestamp last_calculated_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Request to create player ranking stats
message CreatePlayerRankingStatsRequest {
  string member_id = 1;
  string username = 2;
  int32 wins = 3;
  int32 top_threes = 4;
  int32 rating = 5;
  optional int32 rank_position = 6;
}

// MatchHistory represents a single match record
message MatchHistory {
  string id = 1;
  string session_id = 2;
  string member_id = 3;
  bool win = 4;
  int32 final_position = 5;
  int32 kills = 6;
  int32 deaths = 7;
  optional int32 rating_before = 8;
  optional int32 rating_after = 9;
  optional int32 rating_change = 10;
  google.protobuf.Timestamp match_started_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

// Request to create match history record
message CreateMatchHistoryRequest {
  string session_id = 1;
  string member_id = 2;
  bool win = 3;
  int32 final_position = 4;
  int32 kills = 5;
  int32 deaths = 6;
  optional int32 rating_before = 7;
  optional int32 rating_after = 8;
  optional int32 rating_change = 9;
  google.protobuf.Timestamp match_started_at = 10;
}
