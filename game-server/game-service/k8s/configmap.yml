kind: ConfigMap
apiVersion: v1
metadata:
  name: game-service-config
  labels:
    app: cosmic-void
    component: game-service
data:
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: "PRODUCTION"
  GRPC_GAME_ADDR: "7004"
  GRPC_AUTH_ADDR: "7003"
  GAME_PORT: "5555"

  DB_HOST: "auth-service-db"
  DB_PORT: "5432"
  DB_NAME: "cosmic_void_game_service_db"
  DB_USER: "user"

  STATS_DB_HOST: "auth-service-db"
  STATS_DB_PORT: "5432"
  STATS_DB_NAME: "cosmic_void_stats_service_db"
  STATS_DB_USER: "user"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "cosmicvoid"

  REDIS_MODE: "standalone"
  REDIS_ADDR: "redis:6379"

  K8S_NAMESPACE: "cosmic-void"
  COLLECTOR_ENDPOINT: "otel-collector:4317"
