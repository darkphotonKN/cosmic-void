    container_name: cosmic_void_stats_service_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmic_void_stats_service_db
    ports:
      - "5110:5432"
    volumes:
      - cosmic_void_stats_service_pgdata:/var/lib/postgresql/data
    networks:
      - cosmic-void-network

  stats-service-test-db:
