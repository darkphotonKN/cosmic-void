# Grafana Dashboard Provisioning Configuration
#
# This file tells Grafana to automatically load dashboards from a directory
# when it starts up. No manual import needed!

apiVersion: 1

providers:
  - name: 'Game Service Dashboards'
    orgId: 1
    folder: 'Game Performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
