  cosmic-void-network:
    name: cosmic-void-network

volumes:
  cosmic-void-consul-data:
  cosmic-void-rabbitmq-data:
  redis_data:
  # Auth Service volumes
  cosmic_void_auth_service_pgdata:
  cosmic_void_auth_service_test_pgdata:
  # Game Service volumes
  cosmic_void_game_service_pgdata:
  cosmic_void_game_service_test_pgdata:
  # Stats Service volumes
