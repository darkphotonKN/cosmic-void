# =============================================================================
# Redis (in-cluster, dev/learning purposes)
#
# 用 Deployment + emptyDir 而不是 StatefulSet + PVC：
#   - 學習階段不在乎重啟資料保留
#   - emptyDir = pod 重啟資料就消失（簡單）
#   - 要持久化的話改 StatefulSet（Phase 2 進階版）
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app: cosmic-void
    component: redis
spec:
  type: ClusterIP
  selector:
    app: cosmic-void
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app: cosmic-void
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosmic-void
      component: redis
  template:
    metadata:
      labels:
        app: cosmic-void
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
